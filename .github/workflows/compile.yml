name: Build StormCracker Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev rubygems build-essential
        sudo gem install --no-document fpm

    - name: Build Linux Binaries
      run: |
        pyinstaller --noconfirm --onefile --windowed --name stormcracker_gui win_cracker.py
        pyinstaller --noconfirm --onefile --name stormcracker_auditor wifi_auditor.py

    - name: Package DEB
      run: |
        mkdir -p package_deb/usr/local/bin
        cp dist/stormcracker_auditor package_deb/usr/local/bin/
        cp dist/stormcracker_gui package_deb/usr/local/bin/
        fpm -s dir -t deb -n stormcracker -v 1.0.0 -C package_deb \
          --description "StormCracker Autonomous WiFi Auditor Suite" \
          --maintainer "Storm Labs" \
          usr/local/bin

    - name: Push Linux to GitHub Releases
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      with:
        tag_name: latest
        name: "StormCracker Continuous Build"
        files: |
          dist/stormcracker_auditor
          dist/stormcracker_gui
          *.deb
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter

    - name: Build Windows GUI Binary
      run: |
        pyinstaller --noconfirm --onefile --windowed win_cracker.py

    - name: Download and Prepare Dependencies
      run: |
        Invoke-WebRequest -Uri "https://github.com/hashcat/hashcat/releases/download/v6.2.6/hashcat-6.2.6.7z" -OutFile "hashcat.7z"
        Invoke-WebRequest -Uri "https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt" -OutFile "rockyou.txt"
        7z x hashcat.7z
        Move-Item -Path hashcat-6.2.6\* -Destination .

    - name: Compile Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: setup.iss

    - name: Push Windows to GitHub Releases
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      with:
        tag_name: latest
        name: "StormCracker Continuous Build"
        files: Output/WinCracker_Setup.exe
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
